name: Publish C# package to the NuGet registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true

env:
  # tag names are formatted like `v1.0.0`, nuget needs it without a `v`
  PACKAGE_VERSION_PREFIXED: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
  publish:
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: read
      id-token: write # lets NuGet/login request a GitHub OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Format nuget version
        run: |
          echo "PACKAGE_VERSION=${PACKAGE_VERSION_PREFIXED#v}" | tee -a $GITHUB_ENV
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release
        working-directory: GCloud.Compute.Metadata.V1
      # Exchange the OIDC token for a short-lived (1 hour) nuget.org API key, right before pushing.
      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email
      - name: Publish to nuget.org
        run: dotnet nuget push bin/Release/*.nupkg --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json"
        working-directory: GCloud.Compute.Metadata.V1
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
