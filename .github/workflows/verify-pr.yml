name: Test changes
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  enforce-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a release label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          allowed='["feature","bug","maintenance","dependencies","chore","ignore-for-release","major","minor","patch","github-actions"]'
          if jq -e --argjson allowed "$allowed" 'any(.[]; IN($allowed[]))' <<<"$LABELS" >/dev/null; then
            echo "Found a release label"
          else
            echo "::error::Add at least one of these labels: $(jq -r 'join(", ")' <<<"$allowed")"
            exit 1
          fi

  test:
    uses: ./.github/workflows/test.yml
